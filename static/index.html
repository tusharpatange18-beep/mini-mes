<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mini MES · Line board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --concrete: #E8EBEE;
            --panel: #FFFFFF;
            --line: #CDD3DA;
            --ink: #16202B;
            --muted: #566170;
            --blue: #0B5FA5;
            --blue-deep: #073F70;
            --green: #1B7F46;
            --red: #BE2D2D;
            --radius: 6px;
            --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
            --head: 'Barlow Semi Condensed', 'Barlow', system-ui, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--concrete);
            color: var(--ink);
            font: 400 15px/1.45 var(--body);
        }

        h1,
        h2,
        h3 {
            font-family: var(--head);
            margin: 0;
            letter-spacing: 0.005em;
        }

        button,
        input {
            font: inherit;
            color: inherit;
        }

        :focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: 2px;
        }

        /* Top bar */
        .top {
            background: var(--ink);
            color: #fff;
        }

        .top-in {
            max-width: 1480px;
            margin: 0 auto;
            padding: 14px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px 24px;
            align-items: center;
            justify-content: space-between;
        }

        .brand h1 {
            font-size: 26px;
            font-weight: 700;
            line-height: 1.1;
        }

        .brand p {
            margin: 2px 0 0;
            color: #B8C2CE;
            font-size: 14px;
        }

        .tools {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .search {
            display: flex;
        }

        .search input {
            width: 180px;
            padding: 8px 10px;
            border: 1px solid #3A4757;
            border-right: 0;
            border-radius: var(--radius) 0 0 var(--radius);
            background: #0F1822;
            color: #fff;
        }

        .search input::placeholder {
            color: #8895A5;
        }

        .search button {
            padding: 8px 12px;
            border: 1px solid #3A4757;
            border-radius: 0 var(--radius) var(--radius) 0;
            background: #243242;
            color: #fff;
            cursor: pointer;
        }

        .search button:hover {
            background: #2E4054;
        }

        /* Buttons */
        .btn {
            padding: 7px 12px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--panel);
            cursor: pointer;
            font-weight: 500;
            line-height: 1.2;
        }

        .btn:hover {
            border-color: #9AA5B1;
        }

        .btn.primary {
            background: var(--blue);
            border-color: var(--blue);
            color: #fff;
        }

        .btn.primary:hover {
            background: var(--blue-deep);
            border-color: var(--blue-deep);
        }

        .btn.danger {
            border-color: var(--red);
            color: var(--red);
        }

        .btn.danger:hover {
            background: #FBEDED;
        }

        .btn.danger.solid {
            background: var(--red);
            color: #fff;
        }

        .btn.danger.solid:hover {
            background: #9E2323;
        }

        .btn.ghost {
            border-color: transparent;
            background: transparent;
        }

        .btn[aria-disabled="true"] {
            background: #F1F3F5;
            border-color: #E1E5EA;
            color: #7A8591;
            cursor: not-allowed;
        }

        /* Role bar */
        .roles {
            background: var(--panel);
            border-bottom: 1px solid var(--line);
        }

        .roles-in {
            max-width: 1480px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px 24px;
            align-items: center;
            justify-content: space-between;
        }

        .who {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 16px;
            align-items: center;
        }

        .who>span {
            font-weight: 600;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .chip {
            padding: 6px 12px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--panel);
            cursor: pointer;
            font-weight: 500;
        }

        .chip:hover {
            border-color: #9AA5B1;
        }

        .chip[aria-pressed="true"] {
            background: var(--ink);
            border-color: var(--ink);
            color: #fff;
        }

        .role-note {
            color: var(--muted);
            font-size: 14px;
            flex-basis: 100%;
            margin: 0;
        }

        .rule {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            cursor: pointer;
        }

        .rule input {
            width: 18px;
            height: 18px;
            accent-color: var(--red);
        }

        .rule small {
            color: var(--muted);
            font-weight: 400;
        }

        /* Board */
        main {
            max-width: 1480px;
            margin: 0 auto;
            padding: 18px 20px 48px;
        }

        .board {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: minmax(188px, 1fr);
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
            scroll-snap-type: x proximity;
        }

        .col {
            scroll-snap-align: start;
            border-top: 4px solid #8794A3;
            background: #DDE2E7;
            border-radius: 0 0 var(--radius) var(--radius);
            min-height: 220px;
        }

        .col[data-s="QC_FAILED"] {
            border-top-color: var(--red);
        }

        .col[data-s="QC_PASSED"] {
            border-top-color: var(--green);
        }

        .col[data-s="DISPATCHED"] {
            border-top-color: var(--ink);
        }

        .col-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 10px 12px 8px;
        }

        .col-head h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .col-head span {
            color: var(--muted);
            font-weight: 500;
        }

        .col-body {
            display: grid;
            gap: 8px;
            padding: 0 8px 10px;
            align-content: start;
        }

        .col-empty {
            margin: 4px 4px 0;
            color: var(--muted);
            font-size: 14px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 10px 12px 12px;
        }

        .card.flash {
            animation: flash 1.4s ease-out;
        }

        @keyframes flash {
            from {
                background: #DCEBFA;
                border-color: var(--blue);
            }

            to {
                background: var(--panel);
                border-color: var(--line);
            }
        }

        .ref {
            font: 700 19px/1.2 var(--head);
            padding: 0;
            border: 0;
            background: none;
            color: var(--blue);
            cursor: pointer;
            text-align: left;
        }

        .ref:hover {
            text-decoration: underline;
        }

        .ref.plain {
            color: var(--muted);
            cursor: default;
        }

        .ref.plain:hover {
            text-decoration: none;
        }

        .card .prod {
            margin: 2px 0 0;
            font-weight: 500;
        }

        .card .meta {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
        }

        .acts {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .acts .btn {
            padding: 6px 10px;
            font-size: 14px;
        }

        .scrap {
            margin-top: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            color: var(--muted);
        }

        .scrap .btn {
            padding: 4px 10px;
            font-size: 14px;
            border-color: #D9A5A5;
            color: var(--red);
        }

        .empty {
            background: var(--panel);
            border: 1px dashed #9AA5B1;
            border-radius: var(--radius);
            padding: 28px 24px;
            max-width: 520px;
            margin: 24px 0;
        }

        .empty h2 {
            font-size: 22px;
        }

        .empty p {
            margin: 6px 0 16px;
            color: var(--muted);
        }

        /* Dialog + drawer */
        dialog {
            border: 0;
            border-radius: 8px;
            padding: 0;
            color: var(--ink);
            background: var(--panel);
        }

        dialog::backdrop {
            background: rgba(14, 22, 32, 0.55);
        }

        #dlg {
            width: min(440px, calc(100% - 32px));
            animation: pop 0.14s ease-out;
        }

        @keyframes pop {
            from {
                transform: translateY(6px);
                opacity: 0;
            }

            to {
                transform: none;
                opacity: 1;
            }
        }

        #dlg form {
            padding: 20px;
            display: grid;
            gap: 14px;
        }

        #dlg h2 {
            font-size: 24px;
        }

        #dlg .sub {
            margin: -10px 0 0;
            color: var(--muted);
        }

        .field label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .field input {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid #9AA5B1;
            border-radius: var(--radius);
            background: #fff;
        }

        .hint {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .form-err {
            margin: 0;
            padding: 9px 11px;
            border-radius: var(--radius);
            background: #FBEDED;
            color: #8C1F1F;
            border: 1px solid #E8B8B8;
        }

        .form-err[hidden] {
            display: none;
        }

        .row-end {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        #drawer {
            margin: 0 0 0 auto;
            height: 100%;
            max-height: 100%;
            width: min(470px, 100%);
            border-radius: 0;
            animation: slide 0.18s ease-out;
        }

        @keyframes slide {
            from {
                transform: translateX(24px);
                opacity: 0;
            }

            to {
                transform: none;
                opacity: 1;
            }
        }

        .dr-head {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
            padding: 18px 20px 12px;
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            background: var(--panel);
        }

        .dr-head h2 {
            font-size: 28px;
            line-height: 1.1;
        }

        .dr-head p {
            margin: 4px 0 0;
            color: var(--muted);
        }

        .dr-body {
            padding: 4px 20px 28px;
        }

        .badge {
            display: inline-block;
            padding: 2px 9px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            background: #E3ECF5;
            color: var(--blue-deep);
            margin-top: 6px;
        }

        .badge.QC_FAILED,
        .badge.SCRAPPED {
            background: #FBEDED;
            color: #8C1F1F;
        }

        .badge.QC_PASSED {
            background: #E2F3E9;
            color: #14623A;
        }

        .badge.DISPATCHED {
            background: var(--ink);
            color: #fff;
        }

        .dr-body h3 {
            font-size: 18px;
            margin: 20px 0 8px;
        }

        .timeline {
            list-style: none;
            margin: 0;
            padding: 0 0 0 14px;
            border-left: 2px solid var(--line);
        }

        .timeline li {
            position: relative;
            padding: 0 0 14px 14px;
        }

        .timeline li::before {
            content: "";
            position: absolute;
            left: -22px;
            top: 6px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--blue);
            border: 2px solid var(--panel);
        }

        .timeline li:last-child {
            padding-bottom: 0;
        }

        .timeline strong {
            font-weight: 600;
        }

        .timeline small {
            display: block;
            color: var(--muted);
        }

        .kv {
            display: grid;
            grid-template-columns: max-content 1fr;
            gap: 4px 16px;
            margin: 0;
        }

        .kv dt {
            color: var(--muted);
        }

        .kv dd {
            margin: 0;
        }

        .kv-group+.kv-group {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--line);
        }

        /* Toasts */
        #toasts {
            position: fixed;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            display: grid;
            gap: 8px;
            width: min(520px, calc(100% - 32px));
            z-index: 50;
            pointer-events: none;
        }

        .toast {
            pointer-events: auto;
            padding: 11px 14px;
            border-radius: var(--radius);
            background: var(--ink);
            color: #fff;
            border-left: 5px solid var(--green);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
        }

        .toast.err {
            border-left-color: #F27A7A;
        }

        @media (max-width: 640px) {
            .board {
                grid-auto-columns: 82%;
            }

            .search input {
                width: 130px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <header class="top">
        <div class="top-in">
            <div class="brand">
                <h1>Mini MES</h1>
                <p>Bottling line 1: work orders from release to dispatch</p>
            </div>
            <div class="tools">
                <form class="search" id="search" role="search">
                    <input id="find" name="find" placeholder="Batch, e.g. B-0001" aria-label="Find a batch by number"
                        autocomplete="off">
                    <button type="submit">Find</button>
                </form>
                <button class="btn primary" id="new-order" type="button">New work order</button>
            </div>
        </div>
    </header>

    <section class="roles" aria-label="Role">
        <div class="roles-in">
            <div class="who">
                <span id="who-label">Working as</span>
                <div class="chips" id="chips" role="group" aria-labelledby="who-label"></div>
            </div>
            <label class="rule">
                <input type="checkbox" id="rule">
                <span>Show blocked actions <small>(try steps the system should refuse)</small></span>
            </label>
            <p class="role-note" id="role-note"></p>
        </div>
    </section>

    <main>
        <div id="board-wrap"></div>
    </main>

    <dialog id="dlg" aria-labelledby="dlg-title"></dialog>
    <dialog id="drawer" aria-label="Batch history"></dialog>
    <div id="toasts" aria-live="polite"></div>

    <script>
        // ===================================================================================
        // Mini MES web UI. Plain JavaScript, no framework: we build the HTML with el() and
        // redraw the board after every change. The server (app.py) checks every rule again,
        // so this page only decides what to show; it never decides what is allowed.
        // ===================================================================================

        // ---- Fixed data ----

        // The five roles: code sent to the server, label on screen, and what the role does
        const ROLES = [
            { code: 'PLANNER', label: 'Planner', note: 'Creates and releases work orders.' },
            { code: 'STORE_KEEPER', label: 'Store Keeper', note: 'Issues material and moves passed batches to finished goods.' },
            { code: 'OPERATOR', label: 'Line Operator', note: 'Starts production and reports good and rejected quantity.' },
            { code: 'QC_INSPECTOR', label: 'QC Inspector', note: 'Records pass or fail, then decides rework or scrap.' },
            { code: 'DISPATCH_CLERK', label: 'Dispatch Clerk', note: 'Dispatches batches that passed QC.' },
        ];

        // Status code -> words shown on screen
        const STATUS_LABEL = {
            CREATED: 'Created', RELEASED: 'Released', IN_PRODUCTION: 'In production', QC_PENDING: 'QC pending',
            QC_FAILED: 'QC failed', QC_PASSED: 'QC passed', DISPATCHED: 'Dispatched', SCRAPPED: 'Scrapped',
        };

        // The board's columns, left to right (scrapped orders are listed under the board instead)
        const COLUMNS = ['CREATED', 'RELEASED', 'IN_PRODUCTION', 'QC_PENDING', 'QC_FAILED', 'QC_PASSED', 'DISPATCHED'];

        // Role code -> label, e.g. ROLE_LABEL.PLANNER === 'Planner'
        const ROLE_LABEL = {};
        for (const role of ROLES) {
            ROLE_LABEL[role.code] = role.label;
        }

        // Every code we know (roles and statuses) -> words, used to make server messages readable
        const LABELS = {};
        for (const code in ROLE_LABEL) {
            LABELS[code] = ROLE_LABEL[code];
        }
        for (const code in STATUS_LABEL) {
            LABELS[code] = STATUS_LABEL[code];
        }

        /*
         * Every button a work order card can show. For each one:
         *   status  = the card's status that shows this button
         *   role    = the role allowed to press it
         *   path    = the server endpoint: POST /work-orders/{id}/{path}
         *   fields  = form fields to ask for first (optional)
         *   body    = builds the JSON to send from the form values (optional)
         *   done    = message shown after success
         */
        const ACTIONS = [
            { label: 'Release order', done: 'Released', status: 'CREATED', role: 'PLANNER', path: 'release', primary: true },
            {
                label: 'Issue material', done: 'Material issued', status: 'RELEASED', role: 'STORE_KEEPER', path: 'issue-material', primary: true,
                fields: [
                    { name: 'lot_no', label: 'Material lot number', placeholder: 'L-101', required: true },
                    { name: 'qty', label: 'Quantity issued', type: 'number', step: 'any', min: '0.001', required: true },
                ],
                body: function (values) {
                    return { lot_no: values.lot_no.trim(), qty: Number(values.qty) };
                },
            },
            { label: 'Start production', done: 'Production started', status: 'RELEASED', role: 'OPERATOR', path: 'start' },
            {
                label: 'Report output', done: 'Output reported', status: 'IN_PRODUCTION', role: 'OPERATOR', path: 'production', primary: true,
                fields: [
                    { name: 'good_qty', label: 'Good quantity', type: 'number', min: '0', step: '1', required: true },
                    { name: 'rejected_qty', label: 'Rejected quantity', type: 'number', min: '0', step: '1', required: true, value: '0' },
                    { name: 'reason_code', label: 'Reason code', placeholder: 'SPILL', hint: 'Required when rejected quantity is above 0.' },
                ],
                body: function (values) {
                    // An empty reason box is sent as null (no reason)
                    let reason = values.reason_code.trim();
                    if (reason === '') {
                        reason = null;
                    }
                    return { good_qty: Number(values.good_qty), rejected_qty: Number(values.rejected_qty), reason_code: reason };
                },
            },
            {
                label: 'Record pass', done: 'QC pass recorded', status: 'QC_PENDING', role: 'QC_INSPECTOR', path: 'qc', primary: true,
                body: function () {
                    return { result: 'PASS' };
                },
            },
            {
                label: 'Record fail', done: 'QC fail recorded', status: 'QC_PENDING', role: 'QC_INSPECTOR', path: 'qc', danger: true,
                body: function () {
                    return { result: 'FAIL' };
                },
            },
            {
                label: 'Send to rework', done: 'Sent to rework', status: 'QC_FAILED', role: 'QC_INSPECTOR', path: 'disposition', primary: true,
                fields: [{ name: 'defect_type', label: 'Defect type', placeholder: 'Underfill', required: true }],
                body: function (values) {
                    return { decision: 'REWORK', defect_type: values.defect_type.trim() };
                },
            },
            {
                label: 'Scrap batch', done: 'Batch scrapped', status: 'QC_FAILED', role: 'QC_INSPECTOR', path: 'disposition', danger: true,
                fields: [{ name: 'defect_type', label: 'Defect type', placeholder: 'Underfill', required: true }],
                body: function (values) {
                    return { decision: 'SCRAP', defect_type: values.defect_type.trim() };
                },
            },
            { label: 'Move to finished goods', done: 'Moved to finished goods', status: 'QC_PASSED', role: 'STORE_KEEPER', path: 'finished-goods' },
            {
                label: 'Dispatch', done: 'Dispatched', status: 'QC_PASSED', role: 'DISPATCH_CLERK', path: 'dispatch', primary: true,
                fields: [
                    { name: 'customer_order', label: 'Customer order', placeholder: 'CO-77', required: true },
                    { name: 'qty', label: 'Quantity dispatched', type: 'number', min: '1', step: '1', required: true },
                ],
                body: function (values) {
                    return { customer_order: values.customer_order.trim(), qty: Number(values.qty) };
                },
            },
        ];

        const ONE_DAY_MS = 24 * 60 * 60 * 1000;

        // ---- Small helpers ----

        /** Shortcut for document.querySelector: find('#chips') returns the element with id "chips". */
        function find(selector) {
            return document.querySelector(selector);
        }

        /**
         * Creates an HTML element. Example:
         *   el('button', { class: 'btn', onclick: save }, 'Save')  ->  <button class="btn">Save</button>
         * attrs: class -> className, onxxx -> event listener, true -> attribute without value,
         *        false / null / undefined -> attribute left out.
         * children: text, elements, or (nested) lists of them; null and false are skipped.
         */
        function el(tag, attrs, ...children) {
            const node = document.createElement(tag);
            if (!attrs) {
                attrs = {};
            }
            for (const name in attrs) {
                const value = attrs[name];
                if (value === false || value === null || value === undefined) {
                    continue; // leave this attribute out
                }
                if (name === 'class') {
                    node.className = value;
                } else if (name.startsWith('on')) {
                    node.addEventListener(name.slice(2), value); // 'onclick' -> 'click'
                } else if (value === true) {
                    node.setAttribute(name, ''); // e.g. required, hidden
                } else {
                    node.setAttribute(name, value);
                }
            }
            addChildren(node, children);
            return node;
        }

        /** Adds children to a node; goes inside lists (and lists of lists). */
        function addChildren(node, children) {
            for (const child of children) {
                if (child === null || child === undefined || child === false) {
                    continue;
                }
                if (Array.isArray(child)) {
                    addChildren(node, child);
                } else if (child.nodeType) {
                    node.append(child); // already an element
                } else {
                    node.append(document.createTextNode(String(child))); // text or a number
                }
            }
        }

        // Browser storage can be blocked (private mode); then we just don't remember the role
        const store = {
            get(key) {
                try {
                    return localStorage.getItem(key);
                } catch (e) {
                    return null;
                }
            },
            set(key, value) {
                try {
                    localStorage.setItem(key, value);
                } catch (e) {
                    // storage unavailable: ignore
                }
            },
        };

        // Everything the page remembers while it is open
        const state = {
            role: store.get('mes.role'),   // the chosen role (remembered between visits)
            rule: false,                   // "Show blocked actions" checkbox
            orders: [],                    // work orders from the server
            flash: null,                   // id of the card to highlight after an action
        };
        if (!ROLE_LABEL[state.role]) {
            state.role = 'PLANNER'; // nothing saved yet (or an unknown value)
        }

        /** "2026-10-20" -> "20 Oct" */
        function fmtDue(date) {
            return new Date(date + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
        }

        /** "2026-10-09T14:30:00" -> "9 Oct, 14:30" */
        function fmtTime(time) {
            return new Date(time).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
        }

        /** Replaces codes in a server message with words: "QC_PASSED" -> "QC passed". */
        function plain(text) {
            return String(text).replace(/\b[A-Z][A-Z_]+\b/g, function (code) {
                if (LABELS[code]) {
                    return LABELS[code];
                }
                return code; // not a code we know: keep it
            });
        }

        /** Calls the server. Always returns { ok, status, data } instead of throwing. */
        async function api(path, method, body) {
            if (!method) {
                method = 'GET';
            }
            let bodyText = undefined;
            if (body) {
                bodyText = JSON.stringify(body);
            }
            const res = await fetch(path, {
                method: method,
                headers: { 'Content-Type': 'application/json', 'X-Role': state.role },
                body: bodyText,
            });
            let data = null;
            try {
                data = await res.json();
            } catch (e) {
                // no body (or not JSON)
            }
            return { ok: res.ok, status: res.status, data: data };
        }

        /** Turns a failed server answer into a sentence for the user. */
        function problem(response) {
            let detail = null;
            if (response.data) {
                detail = response.data.detail;
            }
            if (!detail) {
                return 'Something went wrong. Try again.';
            }
            // Our own errors (409, 403, ...) are one sentence
            if (typeof detail === 'string') {
                return plain(detail) + '.';
            }
            // Pydantic's 422 errors are a list, one item per bad field
            if (Array.isArray(detail)) {
                const parts = [];
                for (const error of detail) {
                    // error.loc is e.g. ['body', 'qty']; drop 'body' to get the field name
                    let field = '';
                    if (error.loc) {
                        field = error.loc.slice(1).join(' ');
                    }
                    if (field === '') {
                        field = 'Input';
                    }
                    parts.push(field + ': ' + error.msg);
                }
                return parts.join('. ') + '.';
            }
            return JSON.stringify(detail);
        }

        /** Shows a short message in the corner. type 'err' = red, stays longer. */
        function toast(message, type) {
            const isError = type === 'err';
            let cssClass = 'toast ';
            let ariaRole = 'status';
            let showMs = 4000;
            if (isError) {
                cssClass = 'toast err';
                ariaRole = 'alert'; // screen readers announce alerts at once
                showMs = 8000;
            }
            const box = find('#toasts');
            const t = el('div', { class: cssClass, role: ariaRole }, message);
            box.append(t);
            // Keep at most 3 on screen: remove the oldest
            while (box.children.length > 3) {
                box.firstElementChild.remove();
            }
            setTimeout(function () { t.remove(); }, showMs);
        }

        /** "Order #3" before release, the batch number after. */
        function orderRef(wo) {
            if (wo.batch_no) {
                return wo.batch_no;
            }
            return 'Order #' + wo.id;
        }

        // ---- Role chips ----

        function chooseRole(code) {
            state.role = code;
            store.set('mes.role', code); // remember for the next visit
            renderRoles();
            renderBoard();               // buttons change with the role
        }

        function renderRoles() {
            const chips = [];
            for (const role of ROLES) {
                chips.push(el('button', {
                    class: 'chip', type: 'button', 'aria-pressed': String(role.code === state.role),
                    onclick: function () { chooseRole(role.code); },
                }, role.label));
            }
            find('#chips').replaceChildren(...chips);

            for (const role of ROLES) {
                if (role.code === state.role) {
                    find('#role-note').textContent = role.note;
                }
            }
        }

        // ---- Board ----

        /** One button on a card. Buttons for another role stay visible but explain instead of acting. */
        function actionButton(wo, action) {
            const allowed = state.rule || action.role === state.role;

            let cssClass = 'btn ';
            if (action.danger) {
                cssClass = 'btn danger';
            } else if (action.primary && allowed) {
                cssClass = 'btn primary';
            }

            let ariaDisabled = false;
            let title = false;
            if (!allowed) {
                ariaDisabled = 'true';
                title = 'Needs ' + ROLE_LABEL[action.role];
            }

            function onClick() {
                if (allowed) {
                    perform(wo, action);
                } else {
                    toast('Switch to ' + ROLE_LABEL[action.role] + ' to use "' + action.label + '".', 'err');
                }
            }

            return el('button', { class: cssClass, type: 'button', 'aria-disabled': ariaDisabled, title: title, onclick: onClick }, action.label);
        }

        /** One work order card. */
        function card(wo) {
            // After release the card shows its batch number, which opens the batch history
            let ref;
            if (wo.batch_no) {
                ref = el('button', { class: 'ref', type: 'button', title: 'Open batch history', onclick: function () { openTrace(wo.batch_no); } }, wo.batch_no);
            } else {
                ref = el('span', { class: 'ref plain' }, 'Order #' + wo.id);
            }

            // Buttons for this status (or all of them when "Show blocked actions" is ticked)
            const buttons = [];
            for (const action of ACTIONS) {
                if (state.rule || action.status === wo.status) {
                    buttons.push(actionButton(wo, action));
                }
            }
            let actionsBox = null;
            if (buttons.length > 0) {
                actionsBox = el('div', { class: 'acts' }, buttons);
            }

            return el('article', { class: 'card', 'data-id': wo.id },
                ref,
                el('p', { class: 'prod' }, wo.product),
                el('p', { class: 'meta' }, wo.quantity + ' units · due ' + fmtDue(wo.due_date)),
                actionsBox);
        }

        /** The orders that have this status. */
        function ordersWithStatus(status) {
            const result = [];
            for (const order of state.orders) {
                if (order.status === status) {
                    result.push(order);
                }
            }
            return result;
        }

        function renderBoard() {
            const wrap = find('#board-wrap');

            // No orders yet: show a welcome message instead of empty columns
            if (state.orders.length === 0) {
                wrap.replaceChildren(el('div', { class: 'empty' },
                    el('h2', {}, 'No work orders yet'),
                    el('p', {}, 'Create the first order to start the line. Orders move left to right as each role completes a step.'),
                    el('button', { class: 'btn primary', type: 'button', onclick: openNewOrder }, 'New work order')));
                return;
            }

            // One column per status
            const columns = [];
            for (const status of COLUMNS) {
                const items = ordersWithStatus(status);
                let body;
                if (items.length > 0) {
                    body = [];
                    for (const order of items) {
                        body.push(card(order));
                    }
                } else {
                    body = el('p', { class: 'col-empty' }, 'Nothing here');
                }
                columns.push(el('section', { class: 'col', 'data-s': status, 'aria-label': STATUS_LABEL[status] },
                    el('div', { class: 'col-head' }, el('h2', {}, STATUS_LABEL[status]), el('span', {}, items.length)),
                    el('div', { class: 'col-body' }, body)));
            }
            const parts = [el('div', { class: 'board' }, columns)];

            // Scrapped batches: one small button each, under the board
            const scrapped = ordersWithStatus('SCRAPPED');
            if (scrapped.length > 0) {
                const scrapButtons = [];
                for (const order of scrapped) {
                    scrapButtons.push(el('button', { class: 'btn', type: 'button', onclick: function () { openTrace(order.batch_no); } }, order.batch_no));
                }
                parts.push(el('div', { class: 'scrap' }, el('span', {}, 'Scrapped (' + scrapped.length + '):'), scrapButtons));
            }
            wrap.replaceChildren(...parts);

            // Briefly highlight the card that just changed
            if (state.flash !== null) {
                const node = wrap.querySelector('.card[data-id="' + state.flash + '"]');
                if (node) {
                    node.classList.add('flash');
                }
                state.flash = null;
            }
        }

        /** Loads the orders from the server and redraws the board. */
        async function refresh() {
            const r = await api('/work-orders');
            if (r.ok) {
                state.orders = r.data;
                renderBoard();
            } else {
                toast('Could not load work orders. Is the server running?', 'err');
            }
        }

        // ---- Actions and forms ----

        /** Runs a card's action. Actions with fields open a form first. */
        async function perform(wo, action) {
            const ref = orderRef(wo);

            // Sends the action to the server. Returns null on success, or an error message.
            async function run(values) {
                let body = undefined;
                if (action.body) {
                    body = action.body(values);
                }
                const r = await api('/work-orders/' + wo.id + '/' + action.path, 'POST', body);
                if (r.ok) {
                    state.flash = wo.id;
                    toast(action.done + ': ' + ref);
                    await refresh();
                    return null;
                }
                return problem(r);
            }

            if (action.fields) {
                openForm({ title: action.label, sub: ref + ' · ' + wo.product, fields: action.fields, submit: action.label, danger: action.danger, onSubmit: run });
            } else {
                const message = await run({});
                if (message) {
                    toast(message, 'err');
                }
            }
        }

        /** One label + input (+ optional hint) inside a form. */
        function formField(f) {
            let type = 'text';
            if (f.type) {
                type = f.type;
            }
            let hint = null;
            if (f.hint) {
                hint = el('p', { class: 'hint' }, f.hint);
            }
            return el('div', { class: 'field' },
                el('label', { for: 'f-' + f.name }, f.label),
                el('input', {
                    id: 'f-' + f.name, name: f.name, type: type, placeholder: f.placeholder, required: f.required === true,
                    min: f.min, step: f.step, value: f.value, autocomplete: 'off',
                }),
                hint);
        }

        /**
         * Opens the dialog with a form. onSubmit(values) returns null when it worked (the dialog
         * closes) or an error message (shown inside the form, so the user can fix the value).
         */
        function openForm(options) {
            const dlg = find('#dlg');
            const err = el('p', { class: 'form-err', role: 'alert', hidden: true });

            let subLine = null;
            if (options.sub) {
                subLine = el('p', { class: 'sub' }, options.sub);
            }
            const fields = [];
            for (const f of options.fields) {
                fields.push(formField(f));
            }
            let submitClass = 'btn primary';
            if (options.danger) {
                submitClass = 'btn danger solid';
            }

            const form = el('form', { method: 'dialog' },
                el('h2', { id: 'dlg-title' }, options.title),
                subLine,
                fields,
                err,
                el('div', { class: 'row-end' },
                    el('button', { class: 'btn ghost', type: 'button', onclick: function () { dlg.close(); } }, 'Cancel'),
                    el('button', { class: submitClass, type: 'submit' }, options.submit)));

            form.addEventListener('submit', async function (event) {
                event.preventDefault(); // we send the data ourselves
                // Collect the form values into { name: value }
                const values = {};
                for (const [name, value] of new FormData(form)) {
                    values[name] = value;
                }
                const message = await options.onSubmit(values);
                if (message) {
                    err.textContent = message;
                    err.hidden = false;
                } else {
                    dlg.close();
                }
            });

            dlg.replaceChildren(form);
            dlg.showModal();
            const firstInput = form.querySelector('input');
            if (firstInput) {
                firstInput.focus();
            }
        }

        /** The Planner's "New work order" form. The due date starts one week from today. */
        function openNewOrder() {
            const due = new Date(Date.now() + 7 * ONE_DAY_MS).toISOString().slice(0, 10); // "YYYY-MM-DD"

            async function createOrder(values) {
                const r = await api('/work-orders', 'POST', { product: values.product.trim(), quantity: Number(values.quantity), due_date: values.due_date });
                if (!r.ok) {
                    return problem(r);
                }
                state.flash = r.data.id;
                toast('Created: Order #' + r.data.id);
                await refresh();
                return null;
            }

            openForm({
                title: 'New work order', sub: 'Planner creates the order, then releases it to the line.', submit: 'Create work order',
                fields: [
                    { name: 'product', label: 'Product', value: 'Orange juice 1L', required: true },
                    { name: 'quantity', label: 'Quantity', type: 'number', min: '1', step: '1', value: '500', required: true },
                    { name: 'due_date', label: 'Due date', type: 'date', value: due, required: true },
                ],
                onSubmit: createOrder,
            });
        }

        // ---- Batch history (the drawer) ----

        /** A small table of [name, value] pairs, e.g. [['Lot', 'L-101'], ['Quantity', 100]]. */
        function kvGroup(pairs) {
            const items = [];
            for (const pair of pairs) {
                items.push(el('dt', {}, pair[0]));
                items.push(el('dd', {}, pair[1]));
            }
            return el('dl', { class: 'kv kv-group' }, items);
        }

        /** Opens the full history of one batch (R8 traceability). */
        async function openTrace(batch) {
            const r = await api('/trace/' + encodeURIComponent(batch));
            if (!r.ok) {
                if (r.status === 404) {
                    toast('No batch ' + batch + ' found. Batch numbers look like B-0001.', 'err');
                } else {
                    toast(problem(r), 'err');
                }
                return;
            }
            const t = r.data;
            const wo = t.work_order;
            const drawer = find('#drawer');

            // Timeline: every status change, with who made it and when
            const steps = [];
            for (const s of t.status_history) {
                let statusText = STATUS_LABEL[s.to_status];
                if (!statusText) {
                    statusText = s.to_status;
                }
                let roleText = ROLE_LABEL[s.role];
                if (!roleText) {
                    roleText = s.role;
                }
                steps.push(el('li', {}, el('strong', {}, statusText), el('small', {}, roleText + ' · ' + fmtTime(s.changed_at))));
            }
            const sections = [el('h3', {}, 'Timeline'), el('ol', { class: 'timeline' }, steps)];

            // Each other section appears only if the batch has rows for it
            if (t.material_lots.length > 0) {
                sections.push(el('h3', {}, 'Material lots'));
                for (const m of t.material_lots) {
                    sections.push(kvGroup([['Lot', m.lot_no], ['Quantity', m.qty], ['Issued', fmtTime(m.issued_at)]]));
                }
            }
            if (t.production.length > 0) {
                sections.push(el('h3', {}, 'Production'));
                for (const p of t.production) {
                    const pairs = [['Good', p.good_qty], ['Rejected', p.rejected_qty]];
                    if (p.reason_code) {
                        pairs.push(['Reason', p.reason_code]);
                    }
                    sections.push(kvGroup(pairs));
                }
            }
            if (t.qc.length > 0) {
                sections.push(el('h3', {}, 'Quality checks'));
                for (const q of t.qc) {
                    let resultText = 'Fail';
                    if (q.result === 'PASS') {
                        resultText = 'Pass';
                    }
                    const pairs = [['Result', resultText]];
                    if (q.defect_type) {
                        pairs.push(['Defect', q.defect_type]);
                    }
                    if (q.disposition) {
                        let decisionText = 'Scrap';
                        if (q.disposition === 'REWORK') {
                            decisionText = 'Rework';
                        }
                        pairs.push(['Decision', decisionText]);
                    }
                    sections.push(kvGroup(pairs));
                }
            }
            if (t.dispatch.length > 0) {
                sections.push(el('h3', {}, 'Dispatch'));
                for (const x of t.dispatch) {
                    sections.push(kvGroup([['Customer order', x.customer_order], ['Quantity', x.qty], ['Dispatched', fmtTime(x.dispatched_at)]]));
                }
            }

            let statusText = STATUS_LABEL[wo.status];
            if (!statusText) {
                statusText = wo.status;
            }
            drawer.replaceChildren(
                el('div', { class: 'dr-head' },
                    el('div', {},
                        el('h2', {}, wo.batch_no),
                        el('p', {}, wo.product + ' · ' + wo.quantity + ' units · due ' + fmtDue(wo.due_date)),
                        el('span', { class: 'badge ' + wo.status }, statusText)),
                    el('button', { class: 'btn', type: 'button', onclick: function () { drawer.close(); } }, 'Close')),
                el('div', { class: 'dr-body' }, sections));
            drawer.showModal();
        }

        // ---- Wiring: connect the page's fixed buttons, then draw everything ----

        find('#new-order').addEventListener('click', openNewOrder);

        find('#rule').addEventListener('change', function (event) {
            state.rule = event.target.checked;
            renderBoard();
        });

        // Batch search: "b-0001" works too, because we turn it into capitals
        find('#search').addEventListener('submit', function (event) {
            event.preventDefault();
            const batch = find('#find').value.trim().toUpperCase();
            if (batch) {
                openTrace(batch);
            }
        });

        // Clicking the dark area outside a dialog closes it
        for (const id of ['#dlg', '#drawer']) {
            find(id).addEventListener('click', function (event) {
                if (event.target === event.currentTarget) {
                    event.currentTarget.close();
                }
            });
        }

        renderRoles();
        refresh();
    </script>
</body>

</html>
